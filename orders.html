<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — Rabithole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080a;
      --bg-card: #111318;
      --orange: #ff6b00;
      --orange-dim: #e05e00;
      --cyan: #00d4ff;
      --text: #f0f2f5;
      --text-muted: #9aa3b2;
      --border: #2a2f3a;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    nav {
      background: rgba(7,8,10,0.92);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      position: sticky; top: 0; z-index: 50;
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--text); }
    .logo img { height: 36px; border-radius: 6px; }
    .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .logo-text span { color: var(--orange); }
    .nav-links { display: flex; gap: 1.1rem; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
    .nav-links a:hover { color: var(--orange); }

    .container { max-width: 1100px; margin: 0 auto; padding: 2.2rem 1.5rem 4rem; }
    .page-title { font-family: 'Orbitron', sans-serif; font-size: 1.7rem; margin-bottom: 0.3rem; }
    .page-sub { color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.98rem; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.8rem; }
    .stat {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.2rem; text-align: center;
    }
    .stat .num { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--orange); font-weight: 700; }
    .stat .label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }

    table {
      width: 100%; border-collapse: collapse;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden;
    }
    th, td {
      text-align: left; padding: 0.75rem 1rem; font-size: 0.88rem;
      border-bottom: 1px solid var(--border); vertical-align: middle;
    }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.3px; }
    tr:last-child td { border-bottom: none; }
    .status-pill {
      font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 999px;
      text-transform: uppercase;
    }
    .status-pill.COMPLETED { background: rgba(0,180,100,0.15); color: #5ddea0; }
    .status-pill.other { background: rgba(255,180,0,0.12); color: #ffcf5c; }
    .hint { font-size: 0.78rem; color: var(--text-muted); }

    .fulfillment-select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.82rem; font-family: inherit;
      cursor: pointer;
    }
    .fulfillment-select.Pending { border-color: #ffcf5c; color: #ffcf5c; }
    .fulfillment-select.Shipped { border-color: var(--cyan); color: var(--cyan); }
    .fulfillment-select.Delivered { border-color: #5ddea0; color: #5ddea0; }
    .fulfillment-select.Cancelled { border-color: #ff6b6b; color: #ff6b6b; }

    .btn-delete, .btn-view {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.78rem; cursor: pointer;
      font-family: inherit; text-decoration: none; display: inline-block;
    }
    .btn-delete:hover { border-color: #ff6b6b; color: #ff6b6b; }
    .btn-view:hover { border-color: var(--cyan); color: var(--cyan); }
    .row-actions { display: flex; gap: 0.5rem; }

    .tracking-input {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.82rem; font-family: inherit;
      width: 130px;
    }
    .tracking-input:focus { border-color: var(--orange); outline: none; }

    .empty-state {
      text-align: center; padding: 3rem 1.5rem;
      background: var(--bg-card); border: 1px dashed var(--border); border-radius: var(--radius);
      color: var(--text-muted);
    }

    /* Detail view */
    #orderView { display: none; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 0.3rem;
      color: var(--text-muted); background: none; border: none; cursor: pointer;
      font-size: 0.9rem; font-family: inherit; margin-bottom: 1.3rem; padding: 0;
      text-decoration: none;
    }
    .back-btn:hover { color: var(--orange); }
    .detail-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.5rem;
    }
    .detail-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.3rem 1.4rem;
    }
    .detail-card h3 { font-size: 0.95rem; margin-bottom: 0.7rem; }
    .detail-card .address-line { font-size: 0.92rem; color: var(--text); line-height: 1.7; }
    .detail-controls { display: flex; flex-direction: column; gap: 0.9rem; }
    .detail-controls label { font-size: 0.78rem; color: var(--text-muted); display: block; margin-bottom: 0.3rem; }
    .items-table td, .items-table th { padding: 0.65rem 1rem; }
    .order-actions { margin-top: 1.3rem; }

    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { border-bottom: 1px solid var(--border); padding: 0.6rem 0; }
      td { border: none; padding: 0.25rem 1rem; }
      td::before { content: attr(data-label); color: var(--text-muted); display: inline-block; width: 90px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Rabithole">
        <span class="logo-text">Rabi<span>thole</span></span>
      </a>
      <div class="nav-links">
        <a href="admin.html">Dashboard</a>
        <a href="products.html">Shop</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- LIST -->
    <div id="listView">
      <a href="admin.html" class="back-btn">← Back to Dashboard</a>
      <h1 class="page-title">Orders</h1>
      <p class="page-sub">PayPal purchases made through the shop. Each row is one checkout — items bought together ship together.</p>

      <div class="stats">
        <div class="stat"><div class="num" id="orderCount">—</div><div class="label">Orders</div></div>
        <div class="stat"><div class="num" id="totalRevenue">—</div><div class="label">Total Revenue</div></div>
        <div class="stat"><div class="num" id="lastOrder">—</div><div class="label">Most Recent</div></div>
      </div>

      <div id="ordersTableWrap"></div>
    </div>

    <!-- DETAIL -->
    <div id="orderView">
      <button class="back-btn" id="backBtn">← Back to all orders</button>
      <div id="orderDetail"></div>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script>
    if (sessionStorage.getItem('rabithole_auth') !== '1') {
      window.location.href = 'login.html';
    }

    const FULFILLMENT_STATUSES = ['Pending', 'Shipped', 'Delivered', 'Cancelled'];
    let ORDERS = [];

    function formatMoney(n, currency) {
      return (currency === 'USD' || !currency ? '$' : currency + ' ') + Number(n || 0).toFixed(2);
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleString();
    }

    function shippingLines(o) {
      const s = o.shipping || {};
      return [
        s.name,
        s.addressLine1,
        s.addressLine2,
        [s.city, s.state, s.postalCode].filter(Boolean).join(', '),
        s.country,
      ].filter(Boolean);
    }

    function shippingSummary(o) {
      const lines = shippingLines(o);
      if (!lines.length) return '<span class="hint">No address on file</span>';
      const s = o.shipping || {};
      return [s.city, s.state].filter(Boolean).join(', ') || lines[0];
    }

    function itemsSummary(o) {
      if (o.items.length === 1) return o.items[0].productName || o.items[0].productId || '—';
      return `${o.items[0].productName || 'Item'} + ${o.items.length - 1} more`;
    }

    function buildShipNotifyMailto(o) {
      const itemLines = o.items.map(li => '- ' + (li.productName || li.productId || 'Item')).join('\n');
      const greeting = o.payerName ? `Hi ${o.payerName},` : 'Hi,';
      const body = `${greeting}\n\nYour Rabithole order has shipped!\n\nTracking number: ${o.trackingNumber}\n\nItems:\n${itemLines}\n\nThanks for your order!`;
      const subject = 'Your Rabithole order has shipped';
      return `mailto:${encodeURIComponent(o.payerEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    function notifyButtonHtml(o) {
      if (!o.payerEmail) {
        return '<span class="hint">No customer email on file — can\'t notify.</span>';
      }
      if (!o.trackingNumber) {
        return '<span class="hint">Add a tracking number to notify the customer.</span>';
      }
      return `<a class="btn-view" href="${buildShipNotifyMailto(o)}">✉ Notify Customer (Shipped)</a>`;
    }

    async function load() {
      const wrap = document.getElementById('ordersTableWrap');
      if (!window.RabitholeDB) {
        wrap.innerHTML = '<div class="empty-state">Orders require the database server to be running.</div>';
        return;
      }
      try {
        ORDERS = await RabitholeDB.getOrders();
      } catch (err) {
        wrap.innerHTML = `<div class="empty-state">Could not load orders: ${err.message}</div>`;
        return;
      }

      document.getElementById('orderCount').textContent = ORDERS.length;
      const total = ORDERS
        .filter(o => o.status === 'COMPLETED')
        .reduce((sum, o) => sum + Number(o.totalAmount || 0), 0);
      document.getElementById('totalRevenue').textContent = formatMoney(total, ORDERS[0] && ORDERS[0].currency);
      document.getElementById('lastOrder').textContent = ORDERS.length ? formatDate(ORDERS[0].createdAt).split(',')[0] : '—';

      renderList();

      if (window.location.hash.startsWith('#order=')) {
        const pid = decodeURIComponent(window.location.hash.slice(7));
        if (ORDERS.some(o => o.paypalOrderId === pid)) showOrder(pid);
      }
    }

    function renderList() {
      const wrap = document.getElementById('ordersTableWrap');
      if (ORDERS.length === 0) {
        wrap.innerHTML = '<div class="empty-state">No orders yet.</div>';
        return;
      }

      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Items</th>
              <th>Total</th>
              <th>Payer</th>
              <th>Ship To</th>
              <th>Payment</th>
              <th>Fulfillment</th>
              <th>Tracking #</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${ORDERS.map(o => `
              <tr>
                <td data-label="Date">${formatDate(o.createdAt)}</td>
                <td data-label="Items">${itemsSummary(o)}</td>
                <td data-label="Total">${formatMoney(o.totalAmount, o.currency)}</td>
                <td data-label="Payer">${o.payerName || ''}${o.payerEmail ? ' (' + o.payerEmail + ')' : ''}</td>
                <td data-label="Ship To">${shippingSummary(o)}</td>
                <td data-label="Payment"><span class="status-pill ${o.status === 'COMPLETED' ? 'COMPLETED' : 'other'}">${o.status}</span></td>
                <td data-label="Fulfillment">
                  <select class="fulfillment-select ${o.fulfillmentStatus || 'Pending'}" onchange="handleStatusChange('${o.paypalOrderId}', this)">
                    ${FULFILLMENT_STATUSES.map(s => `<option value="${s}" ${s === (o.fulfillmentStatus || 'Pending') ? 'selected' : ''}>${s}</option>`).join('')}
                  </select>
                </td>
                <td data-label="Tracking #">
                  <input type="text" class="tracking-input" value="${o.trackingNumber || ''}" placeholder="Paste tracking #" spellcheck="false" onblur="handleTrackingChange('${o.paypalOrderId}', this)">
                </td>
                <td data-label="">
                  <div class="row-actions">
                    <button class="btn-view" onclick="showOrder('${o.paypalOrderId}')">View</button>
                    <button class="btn-delete" onclick="handleDelete('${o.paypalOrderId}')">Delete</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function showOrder(paypalOrderId) {
      const o = ORDERS.find(x => x.paypalOrderId === paypalOrderId);
      if (!o) return;

      document.getElementById('listView').style.display = 'none';
      document.getElementById('orderView').style.display = 'block';
      history.replaceState(null, '', '#order=' + encodeURIComponent(paypalOrderId));
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const lines = shippingLines(o);

      document.getElementById('orderDetail').innerHTML = `
        <div class="detail-grid">
          <div class="detail-card">
            <h3>Ship To</h3>
            <div class="address-line">${lines.length ? lines.join('<br>') : '<span class="hint">No address on file</span>'}</div>
            <div class="hint" style="margin-top:0.8rem;">${o.payerName || ''}${o.payerEmail ? ' &middot; ' + o.payerEmail : ''}</div>
          </div>
          <div class="detail-card">
            <h3>Fulfillment</h3>
            <div class="detail-controls">
              <div>
                <label>Status</label>
                <select class="fulfillment-select ${o.fulfillmentStatus || 'Pending'}" onchange="handleStatusChange('${o.paypalOrderId}', this)">
                  ${FULFILLMENT_STATUSES.map(s => `<option value="${s}" ${s === (o.fulfillmentStatus || 'Pending') ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </div>
              <div>
                <label>Tracking Number</label>
                <input type="text" class="tracking-input" style="width:100%;" value="${o.trackingNumber || ''}" placeholder="Paste tracking #" spellcheck="false" onblur="handleTrackingChange('${o.paypalOrderId}', this)">
              </div>
              <div>
                ${notifyButtonHtml(o)}
              </div>
            </div>
          </div>
        </div>

        <table class="items-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody>
            ${o.items.map(li => `
              <tr>
                <td data-label="Product">
                  ${li.productName || li.productId || '—'}
                  ${li.productShippingInfo ? `<br><span class="hint">${li.productShippingInfo}</span>` : ''}
                </td>
                <td data-label="Amount">${formatMoney(li.amount, o.currency)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="hint" style="margin-top:1rem;">
          Payment status: <span class="status-pill ${o.status === 'COMPLETED' ? 'COMPLETED' : 'other'}">${o.status}</span>
          &nbsp;·&nbsp; PayPal Order ID: ${o.paypalOrderId || ''}
        </div>

        <div class="order-actions">
          <button class="btn-delete" onclick="handleDelete('${o.paypalOrderId}')">Delete Order</button>
        </div>
      `;
    }

    function showList() {
      document.getElementById('listView').style.display = 'block';
      document.getElementById('orderView').style.display = 'none';
      history.replaceState(null, '', window.location.pathname);
      renderList();
    }

    document.getElementById('backBtn').addEventListener('click', showList);

    function isDetailOpenFor(paypalOrderId) {
      return document.getElementById('orderView').style.display === 'block'
        && window.location.hash === '#order=' + encodeURIComponent(paypalOrderId);
    }

    window.handleStatusChange = async function (paypalOrderId, selectEl) {
      selectEl.disabled = true;
      const newStatus = selectEl.value;
      try {
        await RabitholeDB.updateOrderStatus(paypalOrderId, newStatus);
        const o = ORDERS.find(x => x.paypalOrderId === paypalOrderId);
        if (o) o.fulfillmentStatus = newStatus;
        selectEl.className = 'fulfillment-select ' + newStatus;
        if (isDetailOpenFor(paypalOrderId)) showOrder(paypalOrderId);
      } catch (err) {
        alert('Could not update order: ' + err.message);
      } finally {
        selectEl.disabled = false;
      }
    };

    window.handleTrackingChange = async function (paypalOrderId, inputEl) {
      const value = inputEl.value.trim();
      if (value === inputEl.defaultValue.trim()) return;
      inputEl.disabled = true;
      try {
        await RabitholeDB.updateOrderTracking(paypalOrderId, value);
        const o = ORDERS.find(x => x.paypalOrderId === paypalOrderId);
        if (o) o.trackingNumber = value;
        inputEl.defaultValue = value;
        if (isDetailOpenFor(paypalOrderId)) showOrder(paypalOrderId);
      } catch (err) {
        alert('Could not save tracking number: ' + err.message);
      } finally {
        inputEl.disabled = false;
      }
    };

    window.handleDelete = async function (paypalOrderId) {
      if (!confirm('Delete this entire order? This cannot be undone.')) return;
      try {
        await RabitholeDB.deleteOrder(paypalOrderId);
        ORDERS = ORDERS.filter(o => o.paypalOrderId !== paypalOrderId);
        showList();
      } catch (err) {
        alert('Could not delete order: ' + err.message);
      }
    };

    load();
  </script>
</body>
</html>
