<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Requests — Rabithole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080a;
      --bg-card: #111318;
      --orange: #ff6b00;
      --orange-dim: #e05e00;
      --cyan: #00d4ff;
      --text: #f0f2f5;
      --text-muted: #9aa3b2;
      --border: #2a2f3a;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    nav {
      background: rgba(7,8,10,0.92);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      position: sticky; top: 0; z-index: 50;
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--text); }
    .logo img { height: 36px; border-radius: 6px; }
    .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .logo-text span { color: var(--orange); }
    .nav-links { display: flex; gap: 1.1rem; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
    .nav-links a:hover { color: var(--orange); }

    .container { max-width: 1100px; margin: 0 auto; padding: 2.2rem 1.5rem 4rem; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 0.3rem;
      color: var(--text-muted); background: none; border: none; cursor: pointer;
      font-size: 0.9rem; font-family: inherit; margin-bottom: 1.3rem; padding: 0;
      text-decoration: none;
    }
    .back-btn:hover { color: var(--orange); }

    .page-title { font-family: 'Orbitron', sans-serif; font-size: 1.7rem; margin-bottom: 0.3rem; }
    .page-sub { color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.98rem; }

    table {
      width: 100%; border-collapse: collapse;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden;
    }
    th, td {
      text-align: left; padding: 0.75rem 1rem; font-size: 0.88rem;
      border-bottom: 1px solid var(--border); vertical-align: top;
    }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.3px; }
    tr:last-child td { border-bottom: none; }

    .req-name { font-weight: 600; }
    .req-email { font-size: 0.8rem; color: var(--text-muted); }
    .req-desc { max-width: 320px; white-space: pre-wrap; }
    .hint { font-size: 0.78rem; color: var(--text-muted); }

    .service-tag {
      background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.25);
      color: var(--cyan); font-size: 0.72rem; font-weight: 600;
      padding: 0.2rem 0.55rem; border-radius: 6px; display: inline-block; white-space: nowrap;
    }

    .status-select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.82rem; font-family: inherit;
      cursor: pointer;
    }
    .status-select.New { border-color: #ffcf5c; color: #ffcf5c; }
    .status-select.In-Progress { border-color: var(--cyan); color: var(--cyan); }
    .status-select.Completed { border-color: #5ddea0; color: #5ddea0; }
    .status-select.Declined { border-color: #ff6b6b; color: #ff6b6b; }

    .btn-delete {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.78rem; cursor: pointer;
      font-family: inherit;
    }
    .btn-delete:hover { border-color: #ff6b6b; color: #ff6b6b; }

    .req-photo-thumb {
      width: 56px; height: 56px; object-fit: cover; border-radius: 6px;
      border: 1px solid var(--border); display: block;
    }

    .empty-state {
      text-align: center; padding: 3rem 1.5rem;
      background: var(--bg-card); border: 1px dashed var(--border); border-radius: var(--radius);
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { border-bottom: 1px solid var(--border); padding: 0.6rem 0; }
      td { border: none; padding: 0.35rem 1rem; }
      td::before { content: attr(data-label); color: var(--text-muted); display: block; font-size: 0.72rem; margin-bottom: 0.15rem; }
      .req-desc { max-width: none; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Rabithole">
        <span class="logo-text">Rabi<span>thole</span></span>
      </a>
      <div class="nav-links">
        <a href="admin.html">Dashboard</a>
        <a href="request.html">Public Form</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <a href="admin.html" class="back-btn">← Back to Dashboard</a>
    <h1 class="page-title">Custom Work Requests</h1>
    <p class="page-sub">CAD, printing, build, and web work requests submitted through the public form.</p>

    <div id="requestsTableWrap"></div>
  </div>

  <script src="assets/api.js"></script>
  <script>
    if (sessionStorage.getItem('rabithole_auth') !== '1') {
      window.location.href = 'login.html';
    }

    const REQUEST_STATUSES = ['New', 'In Progress', 'Completed', 'Declined'];

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleString();
    }

    function statusClass(status) {
      return (status || '').replace(/\s+/g, '-');
    }

    async function load() {
      const wrap = document.getElementById('requestsTableWrap');
      if (!window.RabitholeDB) {
        wrap.innerHTML = '<div class="empty-state">Viewing requests requires the database server to be running.</div>';
        return;
      }
      let requests;
      try {
        requests = await RabitholeDB.getRequests();
      } catch (err) {
        wrap.innerHTML = `<div class="empty-state">Could not load requests: ${err.message}</div>`;
        return;
      }

      if (requests.length === 0) {
        wrap.innerHTML = '<div class="empty-state">No requests yet.</div>';
        return;
      }

      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>From</th>
              <th>Type</th>
              <th>Description</th>
              <th>Photo</th>
              <th>Budget / Timeline</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${requests.map(r => `
              <tr data-request-id="${r.id}">
                <td data-label="Date">${formatDate(r.createdAt)}</td>
                <td data-label="From">
                  <div class="req-name">${escapeHtml(r.name)}</div>
                  <div class="req-email"><a href="mailto:${escapeHtml(r.email)}" style="color:inherit;">${escapeHtml(r.email)}</a></div>
                </td>
                <td data-label="Type"><span class="service-tag">${escapeHtml(r.serviceType)}</span></td>
                <td data-label="Description"><div class="req-desc">${escapeHtml(r.description)}</div></td>
                <td data-label="Photo">
                  ${r.photo ? `<a href="${escapeHtml(r.photo)}" target="_blank" rel="noopener"><img class="req-photo-thumb" src="${escapeHtml(r.photo)}" alt="Reference photo"></a>` : '<span class="hint">None</span>'}
                </td>
                <td data-label="Budget / Timeline">
                  ${r.budget ? escapeHtml(r.budget) : '<span class="hint">No budget given</span>'}<br>
                  ${r.timeline ? escapeHtml(r.timeline) : '<span class="hint">No timeline given</span>'}
                </td>
                <td data-label="Status">
                  <select class="status-select ${statusClass(r.status)}" onchange="handleStatusChange('${r.id}', this)">
                    ${REQUEST_STATUSES.map(s => `<option value="${s}" ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}
                  </select>
                </td>
                <td data-label="">
                  <button class="btn-delete" onclick="handleDelete('${r.id}')">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    window.handleStatusChange = async function (id, selectEl) {
      selectEl.disabled = true;
      const newStatus = selectEl.value;
      try {
        await RabitholeDB.updateRequestStatus(id, newStatus);
        selectEl.className = 'status-select ' + newStatus.replace(/\s+/g, '-');
      } catch (err) {
        alert('Could not update request: ' + err.message);
      } finally {
        selectEl.disabled = false;
      }
    };

    window.handleDelete = async function (id) {
      if (!confirm('Delete this request permanently? This cannot be undone.')) return;
      try {
        await RabitholeDB.deleteRequest(id);
        const row = document.querySelector(`tr[data-request-id="${id}"]`);
        if (row) row.remove();
        if (document.querySelectorAll('tr[data-request-id]').length === 0) load();
      } catch (err) {
        alert('Could not delete request: ' + err.message);
      }
    };

    load();
  </script>
</body>
</html>
