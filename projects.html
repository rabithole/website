<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Projects — Rabithole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080a;
      --bg-card: #111318;
      --orange: #ff6b00;
      --orange-dim: #e05e00;
      --cyan: #00d4ff;
      --text: #f0f2f5;
      --text-muted: #9aa3b2;
      --border: #2a2f3a;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(7,8,10,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
    }
    .nav-inner {
      max-width: 1000px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--text); }
    .logo img { height: 36px; border-radius: 6px; }
    .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .logo-text span { color: var(--orange); }
    .nav-links { display: flex; gap: 1.1rem; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
    .nav-links a:hover { color: var(--orange); }
    .nav-links a.active { color: var(--orange); }

    .container { max-width: 1000px; margin: 0 auto; padding: 2.2rem 1.5rem 4rem; }
    .page-header { margin-bottom: 1.8rem; }
    .page-header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.75rem; margin-bottom: 0.3rem; }
    .page-header p { color: var(--text-muted); font-size: 0.98rem; }

    .project-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.4rem;
    }
    .project-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: grid; grid-template-rows: auto 1fr;
    }
    .project-card img { width: 100%; height: 190px; object-fit: cover; display: block; }
    .project-info { padding: 1.5rem; }
    .project-info h3 { font-size: 1.15rem; margin-bottom: 0.5rem; }
    .project-info p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.9rem; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag {
      background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.25);
      color: var(--cyan); font-size: 0.75rem; font-weight: 600;
      padding: 0.2rem 0.55rem; border-radius: 6px;
    }

    .empty-state {
      text-align: center; padding: 3.2rem 1.5rem;
      background: var(--bg-card); border: 1px dashed var(--border); border-radius: var(--radius);
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .project-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Rabithole">
        <span class="logo-text">Rabi<span>thole</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="blog.html">Blog</a>
        <a href="projects.html" class="active">Projects</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>RC Projects</h1>
      <p>Selected builds that taught me the most — from chassis redesigns to suspension geometry experiments.</p>
    </div>

    <div id="projectGrid" class="project-grid"></div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/cart.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    async function render() {
      const grid = document.getElementById('projectGrid');
      if (!window.RabitholeDB) {
        grid.outerHTML = '<div class="empty-state">Projects require the database server to be running.</div>';
        return;
      }
      let projects;
      try {
        projects = await RabitholeDB.getProjects();
      } catch (err) {
        grid.outerHTML = `<div class="empty-state">Could not load projects: ${err.message}</div>`;
        return;
      }

      if (projects.length === 0) {
        grid.outerHTML = '<div class="empty-state">No RC projects yet. Check back soon.</div>';
        return;
      }

      grid.innerHTML = projects.map(p => `
        <div class="project-card">
          <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}">
          <div class="project-info">
            <h3>${escapeHtml(p.title)}</h3>
            <p>${escapeHtml(p.description)}</p>
            <div class="project-tags">
              ${(p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
