<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Projects — Rabithole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080a;
      --bg-card: #111318;
      --orange: #ff6b00;
      --orange-dim: #e05e00;
      --cyan: #00d4ff;
      --text: #f0f2f5;
      --text-muted: #9aa3b2;
      --border: #2a2f3a;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(7,8,10,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
    }
    .nav-inner {
      max-width: 1000px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      row-gap: 0.6rem;
    }
    .logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--text); }
    .logo img { height: 36px; border-radius: 6px; }
    .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .logo-text span { color: var(--orange); }
    .nav-links { display: flex; gap: 1.1rem; align-items: center; flex-wrap: wrap; row-gap: 0.4rem; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
    .nav-links a:hover { color: var(--orange); }
    .nav-links a.active { color: var(--orange); }

    .container { max-width: 1000px; margin: 0 auto; padding: 2.2rem 1.5rem 4rem; }
    .page-header { margin-bottom: 1.8rem; }
    .page-header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.75rem; margin-bottom: 0.3rem; }
    .page-header p { color: var(--text-muted); font-size: 0.98rem; }

    .project-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.4rem;
    }
    .project-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: grid; grid-template-rows: auto 1fr;
      cursor: pointer; transition: border-color 0.2s, transform 0.2s;
    }
    .project-card:hover { border-color: var(--orange); transform: translateY(-2px); }
    .project-card img { width: 100%; height: 190px; object-fit: cover; display: block; }
    .project-card .img-placeholder {
      width: 100%; height: 190px; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.85rem; background: #0c0d10;
    }
    .project-info { padding: 1.5rem; }
    .project-info h3 { font-size: 1.15rem; margin-bottom: 0.5rem; }
    .project-info p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.9rem; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag {
      background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.25);
      color: var(--cyan); font-size: 0.75rem; font-weight: 600;
      padding: 0.2rem 0.55rem; border-radius: 6px;
    }

    .empty-state {
      text-align: center; padding: 3.2rem 1.5rem;
      background: var(--bg-card); border: 1px dashed var(--border); border-radius: var(--radius);
      color: var(--text-muted);
    }

    /* Detail view */
    #projectView { display: none; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 0.3rem;
      color: var(--text-muted); background: none; border: none; cursor: pointer;
      font-size: 0.9rem; font-family: inherit; margin-bottom: 1.3rem; padding: 0;
      text-decoration: none;
    }
    .back-btn:hover { color: var(--orange); }
    .article {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .article .img-placeholder {
      width: 100%; height: 220px; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.9rem; background: #0c0d10;
    }

    .carousel { position: relative; overflow: hidden; background: #0c0d10; transition: height 0.3s ease; }
    .carousel-track { display: flex; height: 100%; transition: transform 0.35s ease; }
    .carousel-slide { width: 100%; height: 100%; flex-shrink: 0; object-fit: contain; display: block; }
    .carousel-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.55); color: #fff; font-size: 1.3rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background 0.2s;
      z-index: 2;
    }
    .carousel-arrow:hover { background: rgba(255,107,0,0.85); }
    .carousel-prev { left: 12px; }
    .carousel-next { right: 12px; }
    .carousel-dots {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 0.4rem; z-index: 2;
    }
    .carousel-dot {
      width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.45);
      border: none; cursor: pointer; padding: 0; transition: background 0.2s, transform 0.2s;
    }
    .carousel-dot.active { background: var(--orange); transform: scale(1.25); }
    .image-description {
      color: var(--text-muted); font-size: 0.9rem; line-height: 1.6;
      padding: 0.9rem 1.8rem; margin: 0; white-space: pre-wrap;
      border-bottom: 1px solid var(--border);
    }
    .article-body-wrap { padding: 2rem 1.8rem; }
    .article-body-wrap h1 {
      font-family: 'Orbitron', sans-serif; font-size: 1.55rem; line-height: 1.3; margin-bottom: 1rem;
    }
    .article-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.4rem; }
    .article-content { color: var(--text); font-size: 1.02rem; white-space: pre-wrap; line-height: 1.7; }

    @media (max-width: 700px) {
      .project-grid { grid-template-columns: 1fr; }
      .article-body-wrap { padding: 1.4rem 1.15rem; }
      .carousel-arrow { width: 30px; height: 30px; font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Rabithole">
        <span class="logo-text">Rabi<span>thole</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="blog.html">Blog</a>
        <a href="projects.html" class="active">Projects</a>
        <a href="request.html">Request Work</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- LIST -->
    <div id="listView">
      <div class="page-header">
        <h1>RC Projects</h1>
        <p>Selected builds that taught me the most — from chassis redesigns to suspension geometry experiments. Click any project for the full write-up.</p>
      </div>

      <div id="projectGrid" class="project-grid"></div>
    </div>

    <!-- DETAIL -->
    <div id="projectView">
      <button class="back-btn" id="backBtn">← Back to all projects</button>
      <article class="article" id="articleContent"></article>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/cart.js"></script>
  <script>
    let PROJECTS = [];

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    async function load() {
      const grid = document.getElementById('projectGrid');
      if (!window.RabitholeDB) {
        grid.outerHTML = '<div class="empty-state">Projects require the database server to be running.</div>';
        return;
      }
      try {
        PROJECTS = await RabitholeDB.getProjects();
      } catch (err) {
        grid.outerHTML = `<div class="empty-state">Could not load projects: ${err.message}</div>`;
        return;
      }

      if (PROJECTS.length === 0) {
        grid.outerHTML = '<div class="empty-state">No RC projects yet. Check back soon.</div>';
        return;
      }

      renderGrid();

      if (window.location.hash.startsWith('#project=')) {
        const id = decodeURIComponent(window.location.hash.slice(9));
        if (PROJECTS.some(p => p.id === id)) showProject(id);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('projectGrid');
      grid.innerHTML = PROJECTS.map(p => `
        <div class="project-card" data-id="${p.id}">
          ${p.image ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}">` : '<div class="img-placeholder">No Image</div>'}
          <div class="project-info">
            <h3>${escapeHtml(p.title)}</h3>
            <p>${escapeHtml(p.description)}</p>
            <div class="project-tags">
              ${(p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.project-card').forEach(el => {
        el.addEventListener('click', () => showProject(el.dataset.id));
      });
    }

    function buildGalleryHtml(images, title) {
      if (images.length === 0) return '<div class="img-placeholder">No Image</div>';
      const slides = images.map(src => `<img class="carousel-slide" src="${escapeHtml(src)}" alt="${escapeHtml(title)}">`).join('');
      const controls = images.length > 1 ? `
          <button type="button" class="carousel-arrow carousel-prev" id="carouselPrev" aria-label="Previous photo">‹</button>
          <button type="button" class="carousel-arrow carousel-next" id="carouselNext" aria-label="Next photo">›</button>
          <div class="carousel-dots">${images.map((_, i) => `<button type="button" class="carousel-dot${i === 0 ? ' active' : ''}" data-index="${i}" aria-label="Photo ${i + 1}"></button>`).join('')}</div>
        ` : '';
      return `
        <div class="carousel" id="projectCarousel">
          <div class="carousel-track" id="carouselTrack">${slides}</div>
          ${controls}
        </div>
      `;
    }

    function initCarousel(count) {
      if (count === 0) return;
      let index = 0;
      const carousel = document.getElementById('projectCarousel');
      const track = document.getElementById('carouselTrack');
      const slides = document.querySelectorAll('.carousel-slide');
      const dots = document.querySelectorAll('.carousel-dot');

      function applyHeight() {
        const img = slides[index];
        const fit = () => {
          if (!img.naturalWidth) return;
          const ratio = img.naturalHeight / img.naturalWidth;
          const naturalHeight = carousel.clientWidth * ratio;
          const nav = document.querySelector('nav');
          const navHeight = nav ? nav.getBoundingClientRect().height : 0;
          const maxHeight = window.innerHeight - navHeight - 16;
          carousel.style.height = Math.round(Math.min(naturalHeight, maxHeight)) + 'px';
        };
        if (img.complete) fit();
        else img.addEventListener('load', fit, { once: true });
      }

      function update() {
        track.style.transform = `translateX(-${index * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === index));
        applyHeight();
      }

      if (count > 1) {
        document.getElementById('carouselPrev').addEventListener('click', () => {
          index = (index - 1 + count) % count;
          update();
        });
        document.getElementById('carouselNext').addEventListener('click', () => {
          index = (index + 1) % count;
          update();
        });
        dots.forEach(d => {
          d.addEventListener('click', () => {
            index = parseInt(d.dataset.index, 10);
            update();
          });
        });
      }

      window.addEventListener('resize', applyHeight);
      applyHeight();
    }

    function showProject(id) {
      const p = PROJECTS.find(x => x.id === id);
      if (!p) return;

      document.getElementById('listView').style.display = 'none';
      document.getElementById('projectView').style.display = 'block';
      history.replaceState(null, '', '#project=' + encodeURIComponent(id));
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const tagsHtml = (p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      const body = p.content && p.content.trim() ? p.content : p.description;
      const images = [...new Set([p.image, ...(p.images || [])].filter(Boolean))];

      document.getElementById('articleContent').innerHTML = `
        ${buildGalleryHtml(images, p.title)}
        ${p.image && p.imageDescription ? `<p class="image-description">${escapeHtml(p.imageDescription)}</p>` : ''}
        <div class="article-body-wrap">
          <h1>${escapeHtml(p.title)}</h1>
          <div class="article-tags">${tagsHtml}</div>
          <div class="article-content">${escapeHtml(body)}</div>
        </div>
      `;
      initCarousel(images.length);
    }

    function showList() {
      document.getElementById('listView').style.display = 'block';
      document.getElementById('projectView').style.display = 'none';
      history.replaceState(null, '', window.location.pathname);
    }

    document.getElementById('backBtn').addEventListener('click', showList);

    load();
  </script>
</body>
</html>
