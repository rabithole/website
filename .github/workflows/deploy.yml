name: Deploy to production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The deploy key on the server has a forced command (see ~/.ssh/authorized_keys),
      # so whatever is in `script` is ignored — the server always runs its own
      # deploy.sh (git pull + restart) regardless of what's requested here.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: echo "deploying"
