<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add RC Project — Rabithole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080a;
      --bg-card: #111318;
      --orange: #ff6b00;
      --orange-dim: #e05e00;
      --cyan: #00d4ff;
      --text: #f0f2f5;
      --text-muted: #9aa3b2;
      --border: #2a2f3a;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    nav {
      background: rgba(7,8,10,0.92);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      position: sticky; top: 0; z-index: 50;
    }
    .nav-inner {
      max-width: 760px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--text); }
    .logo img { height: 36px; border-radius: 6px; }
    .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .logo-text span { color: var(--orange); }
    .nav-links { display: flex; gap: 1.1rem; align-items: center; }
    .nav-links a {
      color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.9rem;
    }
    .nav-links a:hover { color: var(--orange); }
    .nav-links a.active { color: var(--orange); }

    .container { max-width: 760px; margin: 0 auto; padding: 2.2rem 1.5rem 4rem; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 0.3rem;
      color: var(--text-muted); background: none; border: none; cursor: pointer;
      font-size: 0.9rem; font-family: inherit; margin-bottom: 1.3rem; padding: 0;
      text-decoration: none;
    }
    .back-btn:hover { color: var(--orange); }

    .process-steps {
      display: flex; gap: 0.6rem; margin-bottom: 1.6rem; flex-wrap: wrap;
    }
    .step {
      font-size: 0.78rem; font-weight: 600; padding: 0.35rem 0.75rem;
      border-radius: 999px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); color: var(--text-muted);
    }
    .step.active {
      background: rgba(255,107,0,0.15); border-color: rgba(255,107,0,0.4); color: var(--orange);
    }

    .page-title { font-family: 'Orbitron', sans-serif; font-size: 1.7rem; margin-bottom: 0.3rem; }
    .page-sub { color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.98rem; }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem 1.7rem;
    }

    .form-group { margin-bottom: 1.3rem; }
    label {
      display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.4rem;
    }
    label .optional { font-weight: 400; color: var(--text-muted); }

    input[type="text"], textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.98rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--orange); }
    textarea { min-height: 140px; resize: vertical; line-height: 1.55; }

    .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.3rem; }

    .image-option-upload {
      width: 180px; aspect-ratio: 16/10; border: 2px dashed var(--border); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      overflow: hidden; background: var(--bg); transition: border-color 0.2s; margin-top: 0.5rem;
    }
    .image-option-upload:hover { border-color: var(--cyan); }
    .image-option-upload img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #uploadPlaceholder { font-size: 0.75rem; color: var(--text-muted); text-align: center; padding: 0.4rem; }
    .image-option-upload.uploading { opacity: 0.6; pointer-events: none; }
    .clear-image-btn {
      margin-top: 0.6rem; background: none; border: 1px solid var(--border); color: var(--text-muted);
      font-size: 0.8rem; padding: 0.35rem 0.7rem; border-radius: 6px; cursor: pointer; font-family: inherit;
    }
    .clear-image-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

    .gallery-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.5rem; }
    .gallery-item {
      position: relative; width: 100px; height: 100px; border-radius: 8px;
      overflow: hidden; border: 2px solid var(--border);
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-remove-btn {
      position: absolute; top: 4px; right: 4px; z-index: 2;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,0,0,0.7); color: #fff; border: none;
      font-size: 0.7rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .gallery-remove-btn:hover { background: #ff6b6b; }
    .gallery-add-tile {
      width: 100px; height: 100px; border: 2px dashed var(--border); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      color: var(--text-muted); font-size: 0.72rem; text-align: center; background: var(--bg);
      transition: border-color 0.2s; padding: 0.3rem;
    }
    .gallery-add-tile:hover { border-color: var(--cyan); }
    .gallery-add-tile.uploading { opacity: 0.6; pointer-events: none; }

    .actions {
      display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1.6rem; align-items: center;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.8rem 1.4rem; border-radius: 10px; font-weight: 600;
      font-size: 0.95rem; text-decoration: none; border: none; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn-primary:hover { background: var(--orange-dim); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary {
      background: transparent; color: var(--text); border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--cyan); color: var(--cyan); }

    .status {
      margin-top: 1.1rem; padding: 0.85rem 1rem; border-radius: 10px;
      font-size: 0.9rem; display: none;
    }
    .status.success {
      display: block; background: rgba(0,180,100,0.12);
      border: 1px solid rgba(0,180,100,0.35); color: #5ddea0;
    }
    .status.error {
      display: block; background: rgba(220,60,60,0.12);
      border: 1px solid rgba(220,60,60,0.35); color: #ff8a8a;
    }

    @media (max-width: 560px) {
      .actions { flex-direction: column; align-items: stretch; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Rabithole">
        <span class="logo-text">Rabi<span>thole</span></span>
      </a>
      <div class="nav-links">
        <a href="admin.html">Dashboard</a>
        <a href="projects.html">Projects</a>
        <a href="add-project.html" class="active">Add Project</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <a href="admin.html" class="back-btn">← Back to Dashboard</a>
    <div class="process-steps" id="processSteps">
      <span class="step active">1. Details</span>
      <span class="step">2. Image</span>
      <span class="step">3. Publish</span>
    </div>

    <h1 class="page-title" id="pageTitle">Add RC Project</h1>
    <p class="page-sub" id="pageSub">Share a build. It'll show up in the RC Projects section on the homepage.</p>

    <div class="form-card">
      <form id="projectForm" novalidate>
        <div class="form-group">
          <label for="title">Project Title</label>
          <input type="text" id="title" name="title" placeholder="e.g. Lightweight Suspension Overhaul" required maxlength="120" autocomplete="off" spellcheck="true">
        </div>

        <div class="form-group">
          <label for="description">Short Description</label>
          <textarea id="description" name="description" placeholder="One or two sentences — shown on the homepage and project grid." required spellcheck="true"></textarea>
        </div>

        <div class="form-group">
          <label for="content">Full Write-Up <span class="optional">(optional)</span></label>
          <textarea id="content" name="content" placeholder="The full story — problem, process, materials, what you'd do differently. Shown on the project's own detail page. Leave blank to just show the short description there instead." style="min-height:220px;" spellcheck="true"></textarea>
        </div>

        <div class="form-group">
          <label for="tags">Tags <span class="optional">(optional, comma-separated)</span></label>
          <input type="text" id="tags" name="tags" placeholder="FEA, PA6-CF, 1/10 Buggy" spellcheck="false">
        </div>

        <div class="form-group">
          <label>Cover Image <span class="optional">(optional — shown in the project grid)</span></label>
          <div class="image-option-upload" id="uploadOption">
            <img id="uploadPreview" style="display:none;">
            <span id="uploadPlaceholder">+ Upload</span>
          </div>
          <input type="file" id="imageFileInput" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">
          <button type="button" class="clear-image-btn" id="clearImageBtn" style="display:none;">✕ Remove Image</button>
          <div class="hint">PNG, JPG, WEBP, or GIF — up to 8MB.</div>
          <div id="uploadStatus" class="hint"></div>
          <input type="hidden" id="image" name="image" value="">
        </div>

        <div class="form-group">
          <label>Additional Photos <span class="optional">(optional — shown as a gallery on the project's page)</span></label>
          <div class="gallery-grid" id="galleryGrid"></div>
          <input type="file" id="galleryFileInput" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">
          <div class="hint">PNG, JPG, WEBP, or GIF — up to 8MB each.</div>
          <div id="galleryStatus" class="hint"></div>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Publish Project</button>
          <a href="manage-projects.html" class="btn btn-secondary">Cancel</a>
        </div>

        <div id="statusMsg" class="status"></div>
      </form>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script>
    if (sessionStorage.getItem('rabithole_auth') !== '1') {
      window.location.href = 'login.html';
    }

    // Image selection — upload your own
    const uploadOption = document.getElementById('uploadOption');
    const uploadPreview = document.getElementById('uploadPreview');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const uploadStatus = document.getElementById('uploadStatus');
    const imageFileInput = document.getElementById('imageFileInput');
    const clearImageBtn = document.getElementById('clearImageBtn');

    uploadOption.addEventListener('click', () => imageFileInput.click());

    function clearImageSelection() {
      imageFileInput.value = '';
      uploadPreview.src = '';
      uploadPreview.style.display = 'none';
      uploadPlaceholder.style.display = 'block';
      clearImageBtn.style.display = 'none';
      document.getElementById('image').value = '';
    }

    // Removing an image on an already-published project saves immediately —
    // it shouldn't require a separate "Save Changes" click to take effect.
    async function removeImageNow() {
      clearImageSelection();
      uploadStatus.textContent = 'Removing…';
      await loadEditPromise;
      if (!editing || !window.RabitholeDB) {
        uploadStatus.textContent = '';
        return;
      }
      try {
        await RabitholeDB.saveProject({ ...editing, image: '', _isEdit: true });
        editing.image = '';
        uploadStatus.textContent = 'Image removed.';
      } catch (err) {
        uploadStatus.textContent = 'Could not remove image: ' + (err.message || 'unknown error');
      }
    }

    clearImageBtn.addEventListener('click', removeImageNow);

    imageFileInput.addEventListener('change', async () => {
      const file = imageFileInput.files[0];
      if (!file) return;

      const allowed = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
      if (!allowed.includes(file.type)) {
        uploadStatus.textContent = 'Unsupported file type. Use PNG, JPG, WEBP, or GIF.';
        imageFileInput.value = '';
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        uploadStatus.textContent = 'Image is too large (max 8MB).';
        imageFileInput.value = '';
        return;
      }
      if (!window.RabitholeDB) {
        uploadStatus.textContent = 'Uploading requires the database server to be running.';
        imageFileInput.value = '';
        return;
      }

      uploadStatus.textContent = 'Uploading…';
      uploadOption.classList.add('uploading');
      try {
        const result = await RabitholeDB.uploadImage(file);
        document.getElementById('image').value = result.path;
        uploadPreview.src = result.path;
        uploadPreview.style.display = 'block';
        uploadPlaceholder.style.display = 'none';
        clearImageBtn.style.display = 'inline-block';
        uploadStatus.textContent = 'Uploaded.';
      } catch (err) {
        uploadStatus.textContent = 'Upload failed: ' + (err.message || 'unknown error');
        imageFileInput.value = '';
      } finally {
        uploadOption.classList.remove('uploading');
      }
    });

    // Additional photos — gallery shown on the project's own page
    let galleryImages = [];
    const galleryGrid = document.getElementById('galleryGrid');
    const galleryFileInput = document.getElementById('galleryFileInput');
    const galleryStatus = document.getElementById('galleryStatus');

    function renderGallery() {
      galleryGrid.innerHTML = galleryImages.map((src, i) => `
        <div class="gallery-item">
          <img src="${src}">
          <button type="button" class="gallery-remove-btn" data-index="${i}" title="Remove photo">✕</button>
        </div>
      `).join('') + '<div class="gallery-add-tile" id="galleryAddTile"><span>+ Add Photo</span></div>';

      galleryGrid.querySelectorAll('.gallery-remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeGalleryImage(parseInt(btn.dataset.index, 10));
        });
      });
      document.getElementById('galleryAddTile').addEventListener('click', () => galleryFileInput.click());
    }

    // Removing a gallery photo on an already-published project saves immediately —
    // it shouldn't require a separate "Save Changes" click to take effect.
    async function removeGalleryImage(index) {
      galleryImages.splice(index, 1);
      renderGallery();
      galleryStatus.textContent = 'Removing…';
      await loadEditPromise;
      if (!editing || !window.RabitholeDB) {
        galleryStatus.textContent = '';
        return;
      }
      try {
        await RabitholeDB.saveProject({ ...editing, images: galleryImages, _isEdit: true });
        editing.images = galleryImages.slice();
        galleryStatus.textContent = 'Photo removed.';
      } catch (err) {
        galleryStatus.textContent = 'Could not remove photo: ' + (err.message || 'unknown error');
      }
    }

    galleryFileInput.addEventListener('change', async () => {
      const file = galleryFileInput.files[0];
      if (!file) return;

      const allowed = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
      if (!allowed.includes(file.type)) {
        galleryStatus.textContent = 'Unsupported file type. Use PNG, JPG, WEBP, or GIF.';
        galleryFileInput.value = '';
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        galleryStatus.textContent = 'Image is too large (max 8MB).';
        galleryFileInput.value = '';
        return;
      }
      if (!window.RabitholeDB) {
        galleryStatus.textContent = 'Uploading requires the database server to be running.';
        galleryFileInput.value = '';
        return;
      }

      galleryStatus.textContent = 'Uploading…';
      const addTile = document.getElementById('galleryAddTile');
      if (addTile) addTile.classList.add('uploading');
      try {
        const result = await RabitholeDB.uploadImage(file);
        galleryImages.push(result.path);
        renderGallery();
        await loadEditPromise;
        if (editing && window.RabitholeDB) {
          try {
            await RabitholeDB.saveProject({ ...editing, images: galleryImages, _isEdit: true });
            editing.images = galleryImages.slice();
            galleryStatus.textContent = 'Photo added.';
          } catch (err) {
            galleryStatus.textContent = 'Uploaded, but could not save: ' + (err.message || 'unknown error');
          }
        } else {
          galleryStatus.textContent = 'Photo added.';
        }
      } catch (err) {
        galleryStatus.textContent = 'Upload failed: ' + (err.message || 'unknown error');
      } finally {
        galleryFileInput.value = '';
        if (addTile) addTile.classList.remove('uploading');
      }
    });

    renderGallery();

    // Edit mode
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    let editing = null;

    const loadEditPromise = (async function loadEdit() {
      if (!editId) return;
      if (!window.RabitholeDB) return;
      editing = await RabitholeDB.getProject(editId);
      if (editing) {
        document.getElementById('pageTitle').textContent = 'Edit RC Project';
        document.getElementById('pageSub').textContent = 'Update project details and save changes.';
        document.getElementById('submitBtn').textContent = 'Save Changes';
        document.getElementById('title').value = editing.title;
        document.getElementById('description').value = editing.description;
        document.getElementById('content').value = editing.content || '';
        document.getElementById('tags').value = (editing.tags || []).join(', ');
        document.getElementById('image').value = editing.image || '';
        if (editing.image) {
          uploadPreview.src = editing.image;
          uploadPreview.style.display = 'block';
          uploadPlaceholder.style.display = 'none';
          clearImageBtn.style.display = 'inline-block';
        }
        galleryImages = (editing.images || []).slice();
        renderGallery();
      }
    })();

    document.getElementById('projectForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const content = document.getElementById('content').value.trim();
      const tagsRaw = document.getElementById('tags').value.trim();
      const image = document.getElementById('image').value;
      const statusEl = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      if (!title || !description) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Title and description are required.';
        return;
      }
      if (!window.RabitholeDB) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Saving requires the database server to be running.';
        return;
      }

      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
      const project = {
        id: editing ? editing.id : undefined,
        title, description, content, tags, image, images: galleryImages,
        _isEdit: !!editing,
      };

      try {
        await RabitholeDB.saveProject(project);
        document.querySelectorAll('.step').forEach((s, i) => s.classList.toggle('active', i === 2));
        statusEl.className = 'status success';
        if (editing) {
          editing = { ...editing, ...project };
          statusEl.textContent = 'Changes saved.';
        } else {
          statusEl.textContent = 'Project published! Redirecting…';
          submitBtn.disabled = true;
          setTimeout(() => {
            window.location.href = 'manage-projects.html';
          }, 850);
        }
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Save failed: ' + (err.message || 'unknown error');
      }
    });
  </script>
</body>
</html>
